name: CI

on:
  push:
  pull_request:

jobs:
  test-lint-build:
    runs-on: ubuntu-latest

    permissions:
      contents: read
      packages: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true

      - name: Download Go modules
        run: go mod download

      - name: Run golangci-lint
        uses: golangci/golangci-lint-action@v7
        with:
          version: v2.11.2

      - name: Run tests
        run: go test ./...

      - name: Build application
        run: go build -v ./cmd/calculator-service

      - name: Build Docker image
        run: docker build -t calculator-service:ci .

      - name: Log in to GHCR
        if: github.ref == 'refs/heads/main'
        run: echo "${{ secrets.GITHUB_TOKEN }}" | docker login ghcr.io -u ${{ github.actor }} --password-stdin

      - name: Build image for GHCR
        if: github.ref == 'refs/heads/main'
        run: |
          IMAGE=ghcr.io/${{ github.repository_owner }}/calculator-service
          docker build -t $IMAGE:latest -t $IMAGE:${{ github.sha }} .

      - name: Push image
        if: github.ref == 'refs/heads/main'
        run: |
          IMAGE=ghcr.io/${{ github.repository_owner }}/calculator-service
          docker push $IMAGE:latest
          docker push $IMAGE:${{ github.sha }}

      - name: Checkout homelab repository
        if: github.ref == 'refs/heads/main'
        uses: actions/checkout@v4
        with:
          repository: lars-sto/homelab
          token: ${{ secrets.HOMELAB_REPO_TOKEN }}
          path: homelab

      - name: Create pull request in homelab repo
        if: github.ref == 'refs/heads/main' && steps.update_homelab.outputs.changed == 'true'
        uses: peter-evans/create-pull-request@v7
        with:
          token: ${{ secrets.HOMELAB_REPO_TOKEN }}
          path: homelab
          branch: chore/update-calculator-image-${{ github.sha }}
          commit-message: "chore(calculator): update image tag to ${{ github.sha }}"
          title: "chore(calculator): update image tag to ${{ github.sha }}"
          body: |
            Automated update from calculator-service CI.

            - Service repo commit: `${{ github.sha }}`
            - Updated file: `gitops/manifests/services/calculator/kustomization.yaml`
          delete-branch: true
          base: main